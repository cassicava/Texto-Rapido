<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textos Rápidos</title>
    <!-- Ícone do Gatinho na aba do navegador -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐱</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Boas-vindas -->
    <div id="welcome-splash" class="welcome-splash">
        <div class="welcome-content">
            <span id="welcome-emoji" class="welcome-emoji">🐱</span>
            <h1 id="welcome-text"></h1>
        </div>
    </div>

    <div id="screen-flash" class="screen-flash"></div>

    <div class="app-container" id="app-container">
        <header class="app-header">
            <div class="header-actions">
                <div class="glow-wrapper hide-anim" id="wrap-back" style="--glow-color: #5AC8FA;">
                    <button id="btn-back" class="glow-inner mac-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        <span>Voltar</span>
                    </button>
                </div>
                <div class="glow-wrapper" id="wrap-create" style="--glow-color: #007AFF;">
                    <button id="btn-create" class="glow-inner mac-btn">
                        <svg class="create-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        <span id="btn-create-text">Criar</span>
                    </button>
                </div>
                <div class="glow-wrapper" id="wrap-edit" style="--glow-color: #AF52DE;">
                    <button id="btn-edit" class="glow-inner mac-btn">Editar</button>
                </div>
            </div>
        </header>
        
        <main id="main-content" class="main-content">
            <div id="filter-bar" class="filter-bar"></div>
            <div id="card-list" class="card-list"></div>

            <!-- Área de Criação/Edição -->
            <div id="inline-create-container" class="inline-create-container">
                <div class="inline-create-inner">
                    <h2 id="inline-form-title">Novo Texto</h2>
                    
                    <input type="text" id="inline-input-title" placeholder="Título" autocomplete="off" autocapitalize="sentences">
                    <textarea id="inline-input-text" placeholder="Texto" autocapitalize="sentences"></textarea>
                    
                    <div class="color-picker">
                        <div class="color-swatch selected" data-color="#007AFF" style="background: #007AFF; --swatch-color: #007AFF;"></div>
                        <div class="color-swatch" data-color="#FF99C8" style="background: #FF99C8; --swatch-color: #FF99C8;"></div>
                        <div class="color-swatch" data-color="#FFD166" style="background: #FFD166; --swatch-color: #FFD166;"></div>
                        <div class="color-swatch" data-color="#5AC8FA" style="background: #5AC8FA; --swatch-color: #5AC8FA;"></div>
                        <div class="color-swatch" data-color="#34C759" style="background: #34C759; --swatch-color: #34C759;"></div>
                        <div class="color-swatch" data-color="#AF52DE" style="background: #AF52DE; --swatch-color: #AF52DE;"></div>
                        <div class="color-swatch" data-color="#FF3B30" style="background: #FF3B30; --swatch-color: #FF3B30;"></div>
                    </div>

                    <div class="glow-wrapper" style="--glow-color: #34C759; width: 100%;">
                        <button id="inline-btn-save" class="glow-inner mac-btn large btn-success-custom">Salvar</button>
                    </div>
                </div>
            </div>

            <!-- Área de Configurações -->
            <div id="settings-container" class="settings-container">
                <div class="settings-inner">
                    <!-- Backup -->
                    <div class="settings-card glow-inner">
                        <h3>Backup dos Textos</h3>
                        <div class="settings-actions">
                            <div class="glow-wrapper" style="--glow-color: #007AFF;">
                                <button class="glow-inner mac-btn" onclick="exportBackup()">Exportar</button>
                            </div>
                            <div class="glow-wrapper" style="--glow-color: #AF52DE;">
                                <label class="glow-inner mac-btn" style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
                                    Importar
                                    <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importBackup(event)">
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Doação Gatinhos -->
                    <div class="settings-card glow-inner pix-card">
                        <h3>Gatinhos do Posto 🐾</h3>
                        <p>Ajude a manter o sachê da Menininha, do Pitico e do Peludão em dia!</p>
                        
                        <div class="carousel-container">
                            <div class="carousel-inner" id="carousel-inner">
                                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=400&q=80" alt="Menininha" class="carousel-img active">
                                <img src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=400&q=80" alt="Pitico" class="carousel-img">
                                <img src="https://images.unsplash.com/photo-1533738363-b7f9aef128ce?auto=format&fit=crop&w=400&q=80" alt="Peludão" class="carousel-img">
                            </div>
                            <div class="carousel-caption" id="carousel-caption">Menininha na fiscalização</div>
                        </div>

                        <div class="pix-area">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=sua-chave-pix-aqui" alt="QR Code Pix" class="pix-qrcode">
                            <input type="text" value="sua-chave-pix-aqui" readonly id="pix-key-input">
                            <div class="glow-wrapper" style="--glow-color: #34C759; width: 100%;">
                                <button class="glow-inner mac-btn btn-success-custom" style="width: 100%; justify-content: center;" onclick="copyPix()">Copiar Chave Pix</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer id="app-footer" class="app-footer">
            <div class="footer-message-container" onclick="openSettings()">
                <span id="footer-message-text" class="footer-message-text">🐾 Carregando miados...</span>
            </div>
            <div class="glow-wrapper" style="--glow-color: #8E8E93;">
                <button class="glow-inner mac-btn gear-btn" onclick="openSettings()" title="Configurações">
                    <svg viewBox="0 0 24 24" width="28" height="28" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Modal de Confirmação -->
    <div id="confirm-modal" class="modal">
        <div class="modal-backdrop" onclick="closeConfirmModal()"></div>
        <div class="modal-content mac-window confirm-window">
            <h2 style="color: #FF3B30;">Excluir Modelo?</h2>
            <p>Esta ação não poderá ser desfeita. O texto será apagado permanentemente.</p>
            <div class="modal-actions confirm-actions">
                <div class="glow-wrapper" style="--glow-color: #8e8e93; width: 100%;">
                    <button class="glow-inner mac-btn" onclick="closeConfirmModal()">Cancelar</button>
                </div>
                <div class="glow-wrapper" style="--glow-color: #FF3B30; width: 100%;">
                    <button class="glow-inner mac-btn btn-danger" onclick="executeDelete()">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
